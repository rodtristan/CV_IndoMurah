name: indomurah

services:
  # ─── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: indomurah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-toko_cv_indomurah_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - indomurah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indomurah-network

  # ─── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: indomurah-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - indomurah_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indomurah-network

  # ─── API (NestJS + Prisma) ─────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: indomurah-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-toko_cv_indomurah_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      EXPIRATION_TIME: ${EXPIRATION_TIME:-8h}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
      HASH_ID_SALT: ${HASH_ID_SALT:-toko-cv-indomurah-default-salt-change-in-production}
      HASH_ID_MIN_LENGTH: ${HASH_ID_MIN_LENGTH:-8}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - indomurah_api_upload:/app/upload
    networks:
      - indomurah-network

  # ─── Dashboard (Nuxt) ───────────────────────────────────────
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: indomurah-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_SITE_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - indomurah-network

  # ─── Ecommerce (Flutter Web) ────────────────────────────────
  shop:
    build:
      context: ./shop
      dockerfile: Dockerfile
      target: web
    container_name: indomurah-ecommerce
    restart: unless-stopped
    ports:
      - "${ECOMMERCE_PORT:-8081}:80"
    networks:
      - indomurah-network

  # One-off container: builds the ecommerce APK and copies it to the host.
  # Not started by `docker compose up`. Run explicitly:
  #   docker compose --profile build run --rm shop-apk-builder
  shop-apk-builder:
    build:
      context: ./shop
      dockerfile: Dockerfile
      target: apk-build
    container_name: indomurah-ecommerce-apk-builder
    profiles: ["build"]
    volumes:
      - ${APK_OUTPUT_DIR:-C:/Temp}/indomurah-ecommerce:/export

  # ─── HR / Absensi (Flutter Web) ─────────────────────────────
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: web
    container_name: indomurah-hr
    restart: unless-stopped
    ports:
      - "${HR_PORT:-8082}:80"
    networks:
      - indomurah-network

  # One-off container: builds the HR/absensi APK and copies it to the host.
  # Not started by `docker compose up`. Run explicitly:
  #   docker compose --profile build run --rm mobile-apk-builder
  mobile-apk-builder:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: apk-build
    container_name: indomurah-hr-apk-builder
    profiles: ["build"]
    volumes:
      - ${APK_OUTPUT_DIR:-C:/Temp}/indomurah-hr:/export

networks:
  indomurah-network:
    name: indomurah-network

volumes:
  indomurah_postgres_data:
    name: indomurah_postgres_data
  indomurah_redis_data:
    name: indomurah_redis_data
  indomurah_api_upload:
    name: indomurah_api_upload
